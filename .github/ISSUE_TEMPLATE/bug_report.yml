name: Bug report
description: Something in the API does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the endpoint, request and response (status code and body).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. POST /api/auth/login with ...
        2. GET /api/contacts?page=2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: production / local (Windows, Python 3.14)
