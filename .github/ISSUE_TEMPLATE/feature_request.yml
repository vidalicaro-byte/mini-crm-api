name: Feature request
description: Suggest a new endpoint or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Endpoint, parameters and response you have in mind.
    validations:
      required: true
