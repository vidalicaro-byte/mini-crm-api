name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing

  postgres:
    name: Migrations and tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm
      TEST_DATABASE_URL: postgresql://crm:crm@localhost:5432/crm
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Migrate up
        run: uv run alembic upgrade head

      - name: Models match migrations
        run: uv run alembic check

      - name: Seed loads
        run: uv run python -m crm_api.seed

      - name: Migrate down
        run: uv run alembic downgrade base

      - name: Pytest
        run: uv run pytest

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t mini-crm-api .

      - name: Start (migrate, seed, serve) like in production
        run: |
          docker run -d --name api --network host \
            -e PORT=8000 \
            -e JWT_SECRET="$(openssl rand -base64 48)" \
            -e DATABASE_URL=postgresql://crm:crm@localhost:5432/crm \
            mini-crm-api

      - name: Smoke test
        run: |
          for attempt in $(seq 1 30); do
            curl -fs http://localhost:8000/health && break
            sleep 1
          done
          curl -fs http://localhost:8000/health
          curl -fs http://localhost:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email": "marina@minicrm.demo", "password": "demo1234"}' | grep -q '"token"'
          echo "API is up and the demo login works."

      - name: Container logs
        if: always()
        run: docker logs api
